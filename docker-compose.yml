# "Full stack" ở đây chỉ có 1 service (api) — KHÔNG có MLflow/Postgres
# local: MLflow đã hosted trên DagsHub (phiên 5.3), Neon Postgres đã
# hosted (tuần 9, mục 4.8) — không cần chạy lại bản local của những thứ
# đã có bản free hosted sẵn, tránh trùng lặp hạ tầng vô ích.
services:
  api:
    build:
      context: .
      dockerfile: docker/serve.Dockerfile
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
