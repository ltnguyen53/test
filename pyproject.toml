[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "video-action-mlops"
version = "0.1.0"
description = "Video spatio-temporal action recognition — production-grade MLOps skeleton"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "torch>=2.2",
    # torchvision: CHỈ còn dùng torchvision.models.resnet18 (models/spatial.py,
    # phiên 3.1) — KHÔNG còn dùng torchvision.io (video I/O, đã gỡ khỏi
    # run_preprocess.py sau khi phát hiện API đó bị torchvision XOÁ HẲN từ
    # bản 0.28). Chưa pin cận trên — xem phiên pinning (Tuần 13 bổ sung)
    # để khoá version đúng cách qua lock file, không chỉ sửa tay dòng này.
    "torchvision>=0.17",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6.9",
    "mypy>=1.11.2",
    "pre-commit>=3.7",
    # httpx: can cho fastapi.testclient.TestClient (phien 14.3). LUU Y:
    # Starlette gan day (~6/2026) bat dau deprecate httpx cho TestClient,
    # chuyen sang goi moi "httpx2" (StarletteDeprecationWarning). Chon
    # httpx (con hoat dong, chi canh bao) thay vi doan API cua httpx2 con
    # qua moi, chua du on dinh de tin tuong khi khong the tu kiem chung.
    "httpx>=0.27",
]
tracking = [
    "mlflow>=2.14",
    "dvc[s3]>=3.51",
]
serving = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "onnxruntime>=1.18",
    "opencv-python-headless>=4.10",
    # python-multipart: FastAPI cần gói này để đọc UploadFile (endpoint
    # nhận video upload) — thiếu thì request 400 "Form data requires
    # python-multipart" NGAY, kể cả code đúng 100%. Phát hiện THẬT qua
    # verify (chạy tests/unit/test_serving.py với dep cài từ pyproject
    # thay vì cài tay từng gói) — không có trong requirements-serving
    # trước đây dù test_serving.py đã dùng UploadFile từ lâu.
    "python-multipart>=0.0.9",
]
export = [
    "onnxruntime>=1.18",
    # onnx: torch.onnx.export() (dynamo=True, PyTorch >=2.9 — xem docstring
    # export/to_onnx.py) cần package `onnx` để serialize model graph, KHÁC
    # onnxruntime (chỉ chạy inference, không export). Phát hiện THẬT qua
    # verify: chạy tests/unit/test_export.py với dep cài từ pyproject
    # (đúng cách CI thật sẽ cài) báo ModuleNotFoundError: No module named
    # 'onnx' dù onnxruntime đã có sẵn — 2 package khác nhau, dễ tưởng lầm
    # là 1.
    "onnx>=1.16",
]
demo = [
    "gradio>=4.0",
    # onnxruntime + opencv-python-headless: demo/gradio_app.py gọi thẳng
    # inference/pipeline.py (run_two_stage_inference), file đó import
    # THẬT SỰ cv2 + onnxruntime (không chỉ gradio) — thiếu 2 dòng này thì
    # `pip install -e ".[demo]"` xong vẫn ImportError ngay khi chạy demo.
    # Phát hiện THẬT qua verify (đọc lại import thật của
    # inference/pipeline.py khi dựng lock file — phiên 13.4): trước đây
    # 2 gói này chỉ có trong requirements.txt (dành riêng cho HF Spaces)
    # chứ KHÔNG có ở đây, nên nhóm "demo" qua pyproject.toml bị thiếu,
    # dù requirements.txt (đường cài khác) vẫn đủ.
    "onnxruntime>=1.18",
    "opencv-python-headless>=4.10",
]
monitoring = [
    "evidently>=0.4.30",
    "psycopg2-binary>=2.9",
    "pandas>=2.0",
]
ingest = [
    # rarfile: UCF101/UCF11 bản CHÍNH THỨC tải từ crcv.ucf.edu là .rar,
    # KHÔNG phải .zip (nhầm lẫn phổ biến) — data/raw_cache.py::extract_archive()
    # cần package này + công cụ hệ thống `unrar` (không cài qua pip được,
    # xem docstring hàm đó). Tách nhóm riêng (không gộp vào "dev") vì đây
    # là bước ingest dữ liệu 1 LẦN, không cần cho training/serving/
    # monitoring hằng ngày — không nên bắt mọi người cài thêm 1 dependency
    # ít dùng chỉ để chạy `pytest tests/unit`.
    "rarfile>=4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
markers = [
    "gpu: marks tests that require a real GPU (deselect with '-m \"not gpu\"')",
]
addopts = "-ra"
