name: Build & Push Serving Image

"on":
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # cần quyền này để push GHCR bằng GITHUB_TOKEN có sẵn, không cần thêm secret riêng
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # dev: pytest (safety check nhanh trước khi build, xem bước dưới).
      # tracking: dvc[s3] — cần để pull model .onnx (bước tiếp theo).
      # serving/export: `pytest tests/unit` ở dưới chạy TOÀN BỘ test suite
      # (test_serving.py, test_export.py, test_evaluate.py, test_pipeline.py
      # đều cần) — thiếu 2 nhóm này (bug thật, vá phiên 13.4, cùng gốc với
      # ci.yml) khiến job PASS giả trên máy cá nhân (đã lỡ cài sẵn) nhưng
      # ModuleNotFoundError trên runner sạch.
      - run: pip install --no-deps -e .
      - run: |
          pip install \
            -r requirements/dev.lock \
            -r requirements/tracking.lock \
            -r requirements/serving.lock \
            -r requirements/export.lock

      # GAP THẬT cần vá so với bản mẫu roadmap: models/*.onnx được DVC quản
      # lý (dvc.yaml outs, phiên 7.2), KHÔNG nằm trong git — 1 checkout
      # Actions sạch KHÔNG có 2 file này. serve.Dockerfile (phiên 8.2) COPY
      # đích danh models/spatial.onnx + models/temporal.onnx — thiếu bước
      # dvc pull, docker build sẽ lỗi "file not found" ngay ở bước COPY.
      #
      # Dùng lại đúng cách trỏ credential --local như phiên 4.1/6.3 — 2
      # secret DAGSHUB_USERNAME/DAGSHUB_TOKEN phải được thêm thủ công vào
      # Settings > Secrets and variables > Actions của repo (không tự có).
      - name: Configure DVC remote credentials
        env:
          DAGSHUB_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          dvc remote modify origin --local access_key_id "$DAGSHUB_TOKEN"
          dvc remote modify origin --local secret_access_key "$DAGSHUB_TOKEN"

      - name: Pull model artifacts từ DagsHub
        run: dvc pull models/spatial.onnx models/temporal.onnx

      # Safety check nhanh trước khi build+push — KHÔNG chạy full
      # pre-commit (chậm, ci.yml đã lo phần lint riêng ở trigger push/PR).
      # Phòng trường hợp ai đó tag thẳng trên 1 commit chưa từng qua CI
      # (push tag không nhất thiết đi kèm PR).
      - run: pytest tests/unit -m "not gpu"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/serve.Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/serve:${{ github.ref_name }}
