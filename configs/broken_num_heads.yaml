project:
  name: video-action-mlops
  seed: 42

data:
  frames_per_video: 16
  frame_size: [224, 224]
  use_motion_channel: true
  num_classes: 10

phase1:
  embed_dim_out: 512
  epochs: 10
  learning_rate: 0.0003

phase2:
  input_dim: 512
  # Cố tình để 7 không chia hết 512 để test check_divisible
  num_heads: 7
  epochs: 15
  learning_rate: 0.0001
